<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>go-harness</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <header class="sidebar-head">
      <span class="wordmark">go-harness</span>
      <span class="sidebar-actions">
        <button class="btn btn-ghost btn-icon" id="open-settings" title="设置" aria-label="设置">⚙</button>
        <button class="btn btn-ghost btn-icon" id="add-project" title="添加项目目录" aria-label="添加项目目录">+</button>
      </span>
    </header>
    <nav class="project-list" id="project-list" aria-label="项目与会话"></nav>
    <div class="sidebar-empty" id="sidebar-empty">
      <p class="empty-title">还没有项目</p>
      <p class="empty-body">选一个本地目录，它的会话都会列在这里。</p>
      <button class="btn btn-primary" id="add-project-empty">选择项目目录</button>
    </div>
  </aside>

  <main class="work">

    <section class="graph" id="graph" aria-label="对话树">
      <div class="graph-toolbar">
        <span class="graph-title" id="graph-title"></span>
        <span class="graph-actions">
          <button class="btn btn-ghost btn-small" id="toggle-sidebar" title="隐藏 / 显示左侧项目栏">项目</button>
          <button class="btn btn-ghost btn-small" id="toggle-chat" title="隐藏 / 显示右侧对话栏">对话</button>
          <button class="btn btn-ghost btn-small" id="graph-fit">适应画面</button>
        </span>
      </div>
      <div class="graph-viewport" id="graph-viewport">
        <div class="graph-canvas" id="graph-canvas">
          <svg class="graph-edges" id="graph-edges" aria-hidden="true"></svg>
          <div class="graph-nodes" id="graph-nodes"></div>
        </div>
      </div>
      <div class="graph-empty" id="graph-empty">
        <p class="empty-title">选一个会话</p>
        <p class="empty-body">左边挑项目里的会话，这里会把它长成的树画出来。一个节点是一轮问答 —— 点开看那一轮，按节点上的 + 从这儿分出新的一条。</p>
      </div>
    </section>

    <section class="chat" aria-label="对话">
      <header class="chat-head">
        <div class="chat-head-text">
          <span class="chat-title" id="chat-title">新会话</span>
          <span class="chat-branch" id="chat-branch"></span>
        </div>
        <button class="btn btn-ghost btn-small" id="session-delete" title="删除这个会话">删除</button>
      </header>

      <div class="chat-log" id="chat-log">
        <div class="chat-history" id="chat-history"></div>
        <div class="chat-live" id="chat-live"></div>
      </div>

      <form class="composer" id="composer">
        <div class="composer-skills">
          <button type="button" class="btn btn-ghost btn-small" id="skill-pick" title="选一个技能，只对下一条消息生效">技能</button>
          <button type="button" class="skill-chip" id="skill-chip" hidden title="这一轮必须用这个技能，点 × 取消">
            <span class="skill-chip-label"></span><span class="skill-chip-x" aria-hidden="true">×</span>
          </button>
        </div>
        <div class="skill-menu" id="skill-menu" hidden></div>
        <textarea id="composer-input" rows="1" placeholder="说点什么，回车发送，Shift+回车换行" aria-label="输入"></textarea>
        <div class="composer-foot">
          <span class="composer-hint" id="composer-hint"></span>
          <span class="composer-actions">
            <button type="button" class="btn btn-ghost btn-small" id="composer-stop" hidden>停止</button>
            <button type="submit" class="btn btn-primary btn-small" id="composer-send" disabled>发送</button>
          </span>
        </div>
      </form>
    </section>

  </main>

  <div class="splitter splitter--sidebar" id="splitter-sidebar" aria-hidden="true"></div>
  <div class="splitter splitter--chat" id="splitter-chat" aria-hidden="true"></div>
</div>

<div class="modal" id="dirpicker" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="dirpicker-title">
    <header class="modal-head">
      <span id="dirpicker-title">选择项目目录</span>
      <button class="btn btn-ghost btn-icon" id="dirpicker-close" aria-label="关闭">×</button>
    </header>
    <div class="modal-path" id="dirpicker-path"></div>
    <div class="modal-body" id="dirpicker-list"></div>
    <footer class="modal-foot">
      <button class="btn btn-ghost btn-small" id="dirpicker-up">上一层</button>
      <button class="btn btn-primary btn-small" id="dirpicker-pick">选这个目录</button>
    </footer>
  </div>
</div>

<div class="modal" id="settings" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <header class="modal-head">
      <span id="settings-title">设置</span>
      <button class="btn btn-ghost btn-icon" id="settings-close" aria-label="关闭">×</button>
    </header>
    <div class="modal-body">
      <div class="setting-row">
        <span class="setting-label">压缩触发点</span>
        <input type="number" id="setting-compact-at" min="0" step="1000" placeholder="默认" aria-label="压缩触发点（token）">
        <span class="setting-unit">token</span>
      </div>
      <p class="dir-empty">
        上下文涨到这个数就先压一次（留空 = 用默认）。保存后下一条消息就生效，不用重启。<br>
        压得越早越省钱，但模型的原始上下文丢得越多 —— 被压掉的部分只剩摘要。
      </p>
    </div>
    <footer class="modal-foot">
      <span class="composer-hint" id="settings-note"></span>
      <button class="btn btn-primary btn-small" id="settings-save">保存</button>
    </footer>
  </div>
</div>

<div class="modal" id="skills" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="skills-title">
    <header class="modal-head">
      <span id="skills-title">技能</span>
      <button class="btn btn-ghost btn-icon" id="skills-close" aria-label="关闭">×</button>
    </header>
    <!-- 两个根都列出来：技能分用户级和项目级两处，只露一个的话另一个像不存在 -->
    <div class="modal-path skill-roots">
      <span class="skill-root"><span class="skill-root-tag">用户级</span><code id="skills-userdir"></code></span>
      <span class="skill-root"><span class="skill-root-tag">项目级</span><code id="skills-projdir"></code></span>
    </div>
    <div class="modal-body" id="skills-list"></div>
    <footer class="modal-foot">
      <span class="skills-install">
        <select id="skills-scope" aria-label="装到哪一层">
          <option value="user">用户级</option>
          <option value="project">项目级</option>
        </select>
        <input type="file" id="skills-file" accept=".zip,application/zip" hidden>
        <button type="button" class="btn btn-ghost btn-small" id="skills-upload">上传 zip</button>
      </span>
      <span class="composer-hint" id="skills-note"></span>
    </footer>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
